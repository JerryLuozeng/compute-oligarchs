[package]
name = "compute-oligarchs"
version = "0.1.0"
description = "An AI-punk social simulation sandbox"
authors = ["Compute Oligarchs Contributors"]
edition = "2021"

[lib]
name = "compute_oligarchs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
